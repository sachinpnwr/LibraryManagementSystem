<div class="search-wrapper">

  <!-- Search Icon -->
  <span class="search-icon">🔍</span>

  <!-- Input -->
  <input
    type="text"
    class="form-control search-input"
    [placeholder]="placeholder"
    [(ngModel)]="searchTerm"
    (input)="onSearchChange()"
  />

  <!-- Clear Button -->
  @if (searchTerm) {
    <button class="clear-btn" (click)="clear()">✖</button>
  }

</div>
